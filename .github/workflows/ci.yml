name: CI Minimarket

on:
  push:
    branches: [main, develop, 'feature/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop, 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Java 21, Docker y APIs
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Preparar Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y ejecutar las pruebas
        run: bash ./mvnw -B -ntp clean verify

      - name: Preparar una base temporal para CI
        id: config
        shell: python
        run: |
          import os
          import secrets
          from pathlib import Path

          run_id = os.environ['GITHUB_RUN_ID']
          attempt = os.environ['GITHUB_RUN_ATTEMPT']
          values = {
              'APP_PORT': '8081',
              'DB_PORT': '13306',
              'DB_CONTAINER_NAME': 'minimarket-mysql-ci',
              'APP_IMAGE': 'minimarket-app:ci',
              'MYSQL_VOLUME_NAME': f'minimarket_ci_{run_id}_{attempt}',
              'MYSQL_VOLUME_EXTERNAL': 'false',
              'MYSQL_PASSWORD': secrets.token_hex(24),
              'MYSQL_ROOT_PASSWORD': secrets.token_hex(24),
          }
          for key in ('MYSQL_PASSWORD', 'MYSQL_ROOT_PASSWORD'):
              print(f'::add-mask::{values[key]}')
          Path('.env').write_text(
              ''.join(f'{key}={value}\n' for key, value in values.items()),
              encoding='utf-8',
          )

      - name: Construir e iniciar Docker con MySQL
        run: |
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 300

      - name: Probar los cuatro modulos y el inventario
        run: python3 scripts/probar_docker.py --url http://127.0.0.1:8081 --guardar target/ci-estado.json

      - name: Reiniciar y comprobar la persistencia
        run: |
          docker compose stop
          docker compose up -d --no-recreate --wait --wait-timeout 180
          python3 scripts/probar_docker.py --url http://127.0.0.1:8081 --verificar target/ci-estado.json

      - name: Recoger los logs de Docker
        if: ${{ always() && steps.config.outcome == 'success' }}
        run: |
          mkdir -p target/ci-logs
          docker compose ps --all > target/ci-logs/contenedores.txt
          docker compose logs --no-color > target/ci-logs/docker.log 2>&1

      - name: Guardar los informes de pruebas y el JAR
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verificacion-minimarket
          path: |
            target/surefire-reports/
            target/ci-logs/
            target/*.jar
          retention-days: 7
          if-no-files-found: warn

      - name: Eliminar los recursos temporales del runner
        if: ${{ always() && steps.config.outcome == 'success' }}
        run: docker compose down --volumes --remove-orphans
