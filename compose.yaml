name: minimarket

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: minimarket
      MYSQL_USER: minimarket
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      TZ: America/Lima
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  app:
    build:
      context: .
    image: minimarket-app:local
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: minimarket
      DB_PASSWORD: ${MYSQL_PASSWORD:?Define MYSQL_PASSWORD en .env}
      JAVA_TOOL_OPTIONS: -Duser.timezone=America/Lima
    ports:
      - "127.0.0.1:${APP_PORT:-8081}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:8080/api/productos"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    restart: unless-stopped

volumes:
  mysql_data:
